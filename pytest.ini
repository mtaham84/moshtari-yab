[pytest]
# One command for every test: `python -m pytest` (pytest-django runs the Django TestCase suites in apps/ too).
DJANGO_SETTINGS_MODULE = config.settings
testpaths = apps need_engine telegram_crawler workers x_ingest shared instagram_engine tests
python_files = test_*.py tests.py tests_*.py
cache_dir = .cache/pytest
addopts = --basetemp=.cache/pytest/tmp
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning

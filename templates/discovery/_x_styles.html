<style>
.xs-wrap{display:flex;flex-direction:column;gap:18px}
.xs-card{padding:22px}
.xs-muted{color:var(--panel-text-muted);font-size:.85rem;line-height:1.9}
.xs-faint{color:var(--panel-text-faint);font-size:.78rem}
.xs-status{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;padding:6px 12px;border-radius:999px;border:1px solid var(--panel-border-subtle);color:var(--panel-text-muted)}
.xs-dot{width:8px;height:8px;border-radius:50%;background:var(--panel-text-faint)}
.xs-dot.ok{background:var(--p-success);box-shadow:0 0 8px var(--p-success)}
.xs-dot.warn{background:var(--p-warning)}
.xs-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:14px}
.xs-step{border:1px solid var(--panel-border-subtle);border-radius:12px;padding:14px 16px;background:var(--panel-surface)}
.xs-step b{display:block;margin-bottom:6px;color:var(--panel-text-main)}
.xs-step .n{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-size:.75rem;margin-left:6px;border:1px solid var(--obsidian-cyan);color:var(--obsidian-cyan)}
.xs-note{margin-top:14px;padding:10px 14px;border-radius:10px;border:1px dashed var(--panel-border-subtle);font-size:.8rem;color:var(--panel-text-muted);line-height:1.9}
.xs-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.xs-stat{padding:16px 18px}
.xs-stat .v{font-size:1.5rem;font-weight:700;color:var(--panel-text-main)}
.xs-stat .l{font-size:.8rem;color:var(--panel-text-muted);margin-top:4px}
.xs-stat .h{font-size:.72rem;color:var(--panel-text-faint);margin-top:6px;line-height:1.7}
.xs-stat.hl .v{color:var(--p-success)}
.xs-prod{display:flex;align-items:center;gap:16px;padding:16px 4px;border-bottom:1px solid var(--panel-border-subtle);flex-wrap:wrap}
.xs-prod:last-child{border-bottom:0}
.xs-prod .main{flex:1;min-width:220px}
.xs-prod .name{font-weight:700;color:var(--panel-text-main)}
.xs-prod .line{font-size:.8rem;color:var(--panel-text-muted);margin-top:4px;line-height:1.8}
.xs-mini{display:flex;gap:14px;font-size:.78rem;color:var(--panel-text-muted);flex-wrap:wrap}
.xs-mini b{color:var(--panel-text-main)}
.xs-switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-size:.85rem;color:var(--panel-text-main)}
.xs-switch input{position:absolute;opacity:0;width:0;height:0}
.xs-switch .track{position:relative;width:48px;height:26px;border-radius:999px;background:var(--panel-border-subtle);transition:.2s;flex:none}
.xs-switch .track:after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.xs-switch input:checked+.track{background:var(--p-success)}
.xs-switch input:checked+.track:after{right:25px}
.xs-switch input:focus-visible+.track{outline:2px solid var(--obsidian-cyan);outline-offset:2px}
.xs-switch.big .track{width:58px;height:32px}
.xs-switch.big .track:after{width:26px;height:26px}
.xs-switch.big input:checked+.track:after{right:29px}
.xs-switch.disabled{opacity:.5;cursor:not-allowed}
.xs-chips{display:flex;flex-direction:column;gap:10px}
.xs-phrase{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.82rem}
.xs-chip{padding:3px 10px;border-radius:999px;border:1px solid var(--panel-border-subtle);background:var(--panel-surface);color:var(--panel-text-main)}
.xs-or{color:var(--panel-text-faint);font-size:.72rem}
.xs-plus{color:var(--obsidian-cyan);font-weight:700}
.xs-ex{color:var(--panel-text-faint);font-size:.75rem}
.xs-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.xs-tab{padding:6px 14px;border-radius:999px;border:1px solid var(--panel-border-subtle);font-size:.8rem;color:var(--panel-text-muted);text-decoration:none}
.xs-tab.on{border-color:var(--obsidian-cyan);color:var(--obsidian-cyan)}
.xs-log{list-style:none;margin:0;padding:0;position:relative}
.xs-log:before{content:"";position:absolute;top:6px;bottom:6px;right:7px;width:2px;background:var(--panel-border-subtle)}
.xs-ev{position:relative;padding:0 30px 18px 0}
.xs-ev:before{content:"";position:absolute;right:2px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--panel-surface);border:2px solid var(--panel-text-faint)}
.xs-ev.success:before{border-color:var(--p-success);background:var(--p-success)}
.xs-ev.warn:before{border-color:var(--p-warning)}
.xs-ev.info:before{border-color:var(--p-info)}
.xs-ev.search:before{border-color:var(--obsidian-cyan)}
.xs-ev .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--panel-text-muted)}
.xs-tag{padding:2px 10px;border-radius:999px;font-size:.74rem;font-weight:600;border:1px solid var(--panel-border-subtle)}
.xs-tag.success{color:var(--p-success);border-color:var(--p-success);background:var(--p-success-bg)}
.xs-tag.warn{color:var(--p-warning);border-color:var(--p-warning)}
.xs-tag.info{color:var(--p-info);border-color:var(--p-info)}
.xs-tag.muted{color:var(--panel-text-faint)}
.xs-post{margin:8px 0 0;padding:10px 14px;border-radius:10px;background:var(--panel-surface);border:1px solid var(--panel-border-subtle);font-size:.85rem;line-height:1.9;color:var(--panel-text-main);white-space:pre-line;word-break:break-word}
.xs-why{margin-top:6px;font-size:.78rem;color:var(--panel-text-muted);line-height:1.8}
.xs-links{display:flex;gap:12px;margin-top:6px;font-size:.78rem}
.xs-links a{color:var(--obsidian-cyan);text-decoration:none}
.xs-empty{padding:26px;text-align:center;color:var(--panel-text-muted);font-size:.85rem;line-height:2}
</style>

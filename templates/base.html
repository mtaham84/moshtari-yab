{% load static %}
<!doctype html>
<html lang="fa" dir="rtl" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111210">
  <meta name="description" content="مشتری‌یاب، دستیار هوشمند شما برای پیدا کردن مشتری‌های بالقوه در گفتگوهای آنلاین.">
  <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
  <title>{% block title %}مشتری‌یاب | دستیار هوشمند کشف مشتری در گفتگوهای آنلاین{% endblock %}</title>
  <link rel="preload" href="{% static 'fonts/Vazirmatn-variable.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/fonts.css' %}">
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('moshtari-yab-theme') || 'system';
        document.documentElement.dataset.theme = saved;
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="{% static 'css/site.css' %}?v=20261030_1">
  <script src="{% static 'js/site.js' %}?v=20261030_1" defer></script>
  <link rel="stylesheet" href="{% static 'css/ui.css' %}?v=20261030_1">
</head>
<body>
  {% include 'partials/icons.html' %}
  {% block body %}{% endblock %}
</body>
</html>

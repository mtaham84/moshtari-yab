# docker compose run --rm crawler login   → log in to Telegram once (session kept in the appdata volume)
# docker compose up -d --build             → postgres (pgvector) + panel + sync + need_engine + Telegram crawler
#                                            groups to watch are added in the panel («جوامع آنلاین»), no restart needed
# docker compose --profile x up -d         → also the experimental X collector
# docker compose --profile proxy up -d     → also xray (v2ray) for servers without access to Telegram/Gemini:
#                                            put xray/config.json (see xray/config.example.json), then in .env
#                                            TG_PROXY=socks5://xray:1080 and HTTPS_PROXY=http://xray:8080

x-app: &app
  build: .
  image: moshtari-yab:latest
  env_file: .env
  environment: &app-env
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    # Only one DM dispatcher: "command" = ig-outreach service (default), "celery" = celery-beat.
    # If you switch to "celery", also remove/stop the ig-outreach service.
    INSTAGRAM_OUTREACH_DISPATCHER: ${INSTAGRAM_OUTREACH_DISPATCHER:-command}
    # Min minutes between two cold DMs across all senders (both dispatchers); per-account tier delays apply on top.
    INSTAGRAM_OUTREACH_MIN_GAP_MINUTES: ${INSTAGRAM_OUTREACH_MIN_GAP_MINUTES:-20}
    # crawler (schema "crawler") and need_engine (schema "need_engine") use the same POSTGRES_* settings
    TG_SESSION: data/telegram_crawler_session
    NE_MESSAGES_SOURCE: db
    NE_PRODUCTS_SOURCE: db
    X_COLLECT_STATE_FILE: /app/output/x_collector_state.sqlite3
    X_COLLECT_OUTPUT_DIR: /app/output/x_collected
    X_STATUS_FILE: /app/output/x_collected/status.json
  volumes:
    - appdata:/app/data
    - media:/app/media
    - ./apps:/app/apps
    - ./templates:/app/templates
    - ./instagram_engine:/app/instagram_engine
    - ./workers:/app/workers
    - ./need_engine:/app/need_engine
    - ./shared:/app/shared
    - ./x_ingest:/app/x_ingest
    - ./static:/app/static
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer_yab}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    <<: *app
    command: ["web"]
    volumes:
      - appdata:/app/data
      - ./backups:/app/backups
      - media:/app/media
      - xdata:/app/output
      - ./apps:/app/apps
      - ./templates:/app/templates
      - ./instagram_engine:/app/instagram_engine
      - ./workers:/app/workers
      - ./need_engine:/app/need_engine
      - ./shared:/app/shared
      - ./x_ingest:/app/x_ingest
      - ./static:/app/static
      - ./xray:/app/xray   # configs added from the panel must reach the xray service's config.json
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 30s

  sync:
    <<: *app
    command: ["sync"]
    volumes:
      - appdata:/app/data
      - media:/app/media
      - xdata:/app/output
      - ./apps:/app/apps
      - ./templates:/app/templates
      - ./workers:/app/workers
      - ./need_engine:/app/need_engine
      - ./shared:/app/shared
      - ./x_ingest:/app/x_ingest
    depends_on:
      web:
        condition: service_healthy

  engine:
    <<: *app
    command: ["engine"]
    depends_on:
      web:
        condition: service_healthy

  crawler:
    <<: *app
    command: ["crawler"]
    depends_on:
      web:
        condition: service_healthy   # the panel tables (migrations) must exist
    volumes:
      - appdata:/app/data

  x:
    <<: *app
    command: ["x"]
    profiles: ["x"]
    volumes:
      - appdata:/app/data
      - ./backups:/app/backups
      - xdata:/app/output
      - ./apps:/app/apps
      - ./workers:/app/workers
      - ./need_engine:/app/need_engine
      - ./shared:/app/shared
      - ./x_ingest:/app/x_ingest

  ig:
    <<: *app
    environment:
      <<: *app-env
      INSTAGRAM_DAILY_REQUEST_BUDGET: "500"
    command: ["python", "manage.py", "run_instagram_scraper", "--loop", "--interval", "15", "--min-comments", "10"]
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - appdata:/app/data
      - ./backups:/app/backups
      - media:/app/media
      - ./apps:/app/apps
      - ./templates:/app/templates
      - ./instagram_engine:/app/instagram_engine
      - ./workers:/app/workers
      - ./need_engine:/app/need_engine
      - ./shared:/app/shared
    restart: unless-stopped

  ig-outreach:
    <<: *app
    environment:
      <<: *app-env
    command: ["python", "-u", "manage.py", "run_instagram_outreach", "--loop", "--batch-size", "2", "--interval", "20", "--delay-min", "1500", "--delay-max", "3000", "--max-daily-dms", "18"]
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - appdata:/app/data
      - ./backups:/app/backups
      - media:/app/media
      - ./apps:/app/apps
      - ./templates:/app/templates
      - ./instagram_engine:/app/instagram_engine
      - ./workers:/app/workers
      - ./need_engine:/app/need_engine
      - ./shared:/app/shared
    restart: unless-stopped

  channel-config-sync:
    <<: *app
    environment:
      <<: *app-env
    command: ["python", "-u", "manage.py", "run_channel_config_automation", "--all", "--loop", "--interval", "180", "--max-add", "10"]
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - appdata:/app/data
      - ./backups:/app/backups
      - media:/app/media
      - ./apps:/app/apps
      - ./templates:/app/templates
      - ./xray:/app/xray
      - ./workers:/app/workers
    restart: unless-stopped

  retention:
    <<: *app
    profiles: ["maintenance"]
    entrypoint: ["python", "manage.py"]
    command: ["purge_retained_data"]
    volumes:
      - appdata:/app/data
      - media:/app/media
      - xdata:/app/output

  retention-report:
    <<: *app
    profiles: ["maintenance"]
    command: ["retention-report"]
    environment:
      <<: *app-env
      RETENTION_REPORT_INTERVAL_HOURS: ${RETENTION_REPORT_INTERVAL_HOURS:-168}
    volumes:
      - appdata:/app/data
      - media:/app/media
      - xdata:/app/output

  db-backup:
    <<: *app
    profiles: ["maintenance"]
    entrypoint: ["python", "manage.py"]
    command: ["backup_database"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - appdata:/app/data
      - ./backups:/app/backups
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  celery-worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-l", "info", "-c", "2", "-Q", "outreach,periodic,default"]
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - appdata:/app/data
      - media:/app/media
      - ./apps:/app/apps
      - ./templates:/app/templates
      - ./instagram_engine:/app/instagram_engine
      - ./workers:/app/workers
      - ./xray:/app/xray
    restart: unless-stopped

  celery-beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "-l", "info", "-s", "/app/data/celerybeat-schedule"]
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - appdata:/app/data
      - ./apps:/app/apps
    restart: unless-stopped

  xray:
    image: ${XRAY_IMAGE:-teddysun/xray}
    profiles: ["proxy"]
    # The app rewrites xray/config.json whenever V2Ray configs are added or die; watch.sh restarts xray when the
    # file changes (at most every XRAY_RELOAD_MIN_SECONDS), so new dedicated ports go live without a manual restart.
    # The whole folder is mounted: the file is replaced atomically, which a single-file mount would never see.
    entrypoint: ["/bin/sh", "/etc/xray/watch.sh"]
    environment:
      XRAY_RELOAD_MIN_SECONDS: ${XRAY_RELOAD_MIN_SECONDS:-60}
      XRAY_WATCH_POLL_SECONDS: ${XRAY_WATCH_POLL_SECONDS:-2}
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./xray:/etc/xray:ro
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
  media:
  xdata:
  redisdata:

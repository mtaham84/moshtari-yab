# docker compose run --rm crawler login   → log in to Telegram once (session kept in the appdata volume)
# docker compose up -d --build             → postgres (pgvector) + panel + sync + need_engine + Telegram crawler
#                                            groups to watch are added in the panel («جوامع آنلاین»), no restart needed
# docker compose --profile x up -d         → also the experimental X collector
# docker compose --profile proxy up -d     → also xray (v2ray) for servers without access to Telegram/Gemini:
#                                            put xray/config.json (see xray/config.example.json), then in .env
#                                            TG_PROXY=socks5://xray:1080 and HTTPS_PROXY=http://xray:8080

x-app: &app
  build: .
  image: moshtari-yab:latest
  env_file: .env
  environment: &app-env
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    # crawler (schema "crawler") and need_engine (schema "need_engine") use the same POSTGRES_* settings
    TG_SESSION: data/telegram_crawler_session
    NE_MESSAGES_SOURCE: db
    NE_PRODUCTS_SOURCE: db
    X_COLLECT_STATE_FILE: /app/output/x_collector_state.sqlite3
    X_COLLECT_OUTPUT_DIR: /app/output/x_collected
    X_STATUS_FILE: /app/output/x_collected/status.json
  volumes:
    - appdata:/app/data
    - media:/app/media
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer_yab}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    <<: *app
    command: ["web"]
    volumes:
      - appdata:/app/data
      - media:/app/media
      - xdata:/app/output
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 30s

  sync:
    <<: *app
    command: ["sync"]
    volumes:
      - appdata:/app/data
      - media:/app/media
      - xdata:/app/output
    depends_on:
      web:
        condition: service_healthy

  engine:
    <<: *app
    command: ["engine"]
    depends_on:
      web:
        condition: service_healthy

  crawler:
    <<: *app
    command: ["crawler"]
    depends_on:
      web:
        condition: service_healthy   # the panel tables (migrations) must exist
    volumes:
      - appdata:/app/data

  x:
    <<: *app
    command: ["x"]
    profiles: ["x"]
    volumes:
      - appdata:/app/data
      - xdata:/app/output

  ig:
    <<: *app
    command: ["python", "manage.py", "run_instagram_scraper", "--loop", "--all-businesses", "--interval", "15", "--min-comments", "50", "--max-posts", "6"]
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - appdata:/app/data
      - media:/app/media
    restart: unless-stopped

  retention:
    <<: *app
    profiles: ["maintenance"]
    entrypoint: ["python", "manage.py"]
    command: ["purge_retained_data"]
    volumes:
      - appdata:/app/data
      - media:/app/media
      - xdata:/app/output

  retention-report:
    <<: *app
    profiles: ["maintenance"]
    command: ["retention-report"]
    environment:
      <<: *app-env
      RETENTION_REPORT_INTERVAL_HOURS: ${RETENTION_REPORT_INTERVAL_HOURS:-168}
    volumes:
      - appdata:/app/data
      - media:/app/media
      - xdata:/app/output

  xray:
    image: ${XRAY_IMAGE:-teddysun/xray}
    profiles: ["proxy"]
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
  media:
  xdata:

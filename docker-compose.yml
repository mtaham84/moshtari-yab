# docker compose up -d --build        → postgres (pgvector) + panel + sync + need_engine
# docker compose --profile crawler up -d   → also the Telegram crawler (log in once first, see README)
# docker compose --profile x up -d         → also the experimental X collector

x-app: &app
  build: .
  image: moshtari-yab:latest
  env_file: .env
  environment: &app-env
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    # crawler (schema "crawler") and need_engine (schema "need_engine") use the same POSTGRES_* settings
    TG_SESSION: data/telegram_crawler_session
    NE_MESSAGES_SOURCE: db
    NE_PRODUCTS_SOURCE: db
  volumes:
    - appdata:/app/data
    - media:/app/media
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer_yab}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    <<: *app
    command: ["web"]
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 30s

  sync:
    <<: *app
    command: ["sync"]
    depends_on:
      web:
        condition: service_healthy

  engine:
    <<: *app
    command: ["engine"]
    depends_on:
      web:
        condition: service_healthy

  crawler:
    <<: *app
    command: ["crawler"]
    profiles: ["crawler"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      TG_GROUPS_FILE: groups.txt
    volumes:
      - appdata:/app/data
      - ./groups.txt:/app/groups.txt:ro
    stdin_open: true
    tty: true

  x:
    <<: *app
    command: ["x"]
    profiles: ["x"]
    volumes:
      - appdata:/app/data
      - xdata:/app/output

volumes:
  pgdata:
  appdata:
  media:
  xdata:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" fill="none">
  <defs>
    <!-- Suit Gradients -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e8268e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8268e"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="gloveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8268e" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#7928ca" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Explorer -->
  <circle cx="280" cy="240" r="160" fill="url(#glowPulse)" filter="url(#bloom)"/>

  <!-- Thruster Particles Stream -->
  <g opacity="0.7">
    <circle cx="160" cy="380" r="4" fill="#38bdf8"/>
    <circle cx="130" cy="410" r="3" fill="#818cf8"/>
    <circle cx="110" cy="440" r="5" fill="#e8268e"/>
    <circle cx="90" cy="470" r="2.5" fill="#ffffff"/>
    <circle cx="140" cy="450" r="3.5" fill="#38bdf8"/>
  </g>

  <!-- Backpack / Life Support Unit -->
  <rect x="180" y="150" width="70" height="130" rx="20" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="195" y="165" width="40" height="25" rx="6" fill="#0f172a"/>
  <circle cx="205" cy="177" r="4" fill="#10b981"/>
  <circle cx="225" cy="177" r="4" fill="#38bdf8"/>
  <path d="M190 270 Q 150 320 180 370" stroke="#64748b" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Left Leg (Trailing Back) -->
  <g>
    <path d="M210 270 L 160 360 L 110 400" stroke="#cbd5e1" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M110 400 L 80 435" stroke="#334155" stroke-width="34" stroke-linecap="round"/>
    <!-- Boot detail -->
    <path d="M80 435 L 55 450 L 75 465" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="160" cy="360" r="14" fill="#64748b"/>
  </g>

  <!-- Right Leg (Bent Forward Dynamic) -->
  <g>
    <path d="M250 280 L 220 370 L 170 440" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M170 440 L 140 480" stroke="#1e293b" stroke-width="36" stroke-linecap="round"/>
    <!-- Boot detail -->
    <path d="M140 480 L 115 500 L 145 515" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="220" cy="370" r="16" fill="#94a3b8"/>
  </g>

  <!-- Torso & Chest Armor -->
  <path d="M210 160 C 230 140 310 150 320 190 L 290 290 C 270 310 230 300 210 280 Z" fill="url(#suitGrad)"/>
  <!-- Chest Control Module -->
  <rect x="240" y="195" width="55" height="50" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="250" y="205" width="35" height="8" rx="3" fill="url(#accentGrad)"/>
  <circle cx="255" cy="228" r="4" fill="#38bdf8"/>
  <circle cx="270" cy="228" r="4" fill="#10b981"/>
  <circle cx="285" cy="228" r="4" fill="#f59e0b"/>

  <!-- Left Arm (Stabilizing) -->
  <g>
    <path d="M225 180 L 180 230 L 195 280" stroke="#e2e8f0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="180" cy="230" r="12" fill="#64748b"/>
    <!-- Left Glove -->
    <path d="M195 280 L 205 310" stroke="url(#gloveGrad)" stroke-width="24" stroke-linecap="round"/>
  </g>

  <!-- Helmet & Visor (Reflective Glow) -->
  <circle cx="310" cy="130" r="54" fill="#ffffff"/>
  <circle cx="310" cy="130" r="52" fill="#0f172a"/>
  <!-- Golden/Cosmic Visor -->
  <ellipse cx="322" cy="130" rx="36" ry="38" fill="url(#visorGrad)"/>
  <!-- Visor Glare / Star Reflection -->
  <ellipse cx="334" cy="118" rx="14" ry="8" transform="rotate(-30 334 118)" fill="#ffffff" opacity="0.85"/>
  <circle cx="346" cy="112" r="3" fill="#ffffff" opacity="0.95"/>
  <!-- Helmet Collar -->
  <path d="M270 170 C 285 185 335 185 350 170" stroke="#64748b" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Right Arm (Reaching Forward toward the Bright Star!) -->
  <g>
    <path d="M310 180 L 380 130 L 450 75" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="380" cy="130" r="13" fill="#cbd5e1"/>
    <!-- Extended Glove reaching upward -->
    <path d="M450 75 L 475 55" stroke="url(#gloveGrad)" stroke-width="24" stroke-linecap="round"/>
    <!-- Reaching Fingers toward celestial light -->
    <path d="M475 55 L 490 40" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M472 50 L 485 34" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
    <path d="M465 52 L 476 38" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <!-- Glowing light spark at fingertips -->
    <circle cx="492" cy="38" r="8" fill="#ffffff" filter="url(#bloom)"/>
    <circle cx="492" cy="38" r="3" fill="#ffffff"/>
  </g>
</svg>

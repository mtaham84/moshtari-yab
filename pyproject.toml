[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*/migrations/*", ".venv", "node_modules", "data", "docs"]

[tool.ruff.lint]
# Stage 1 (INF-01): syntax/undefined names + unused/duplicate imports and variables.
# Stage 2 candidates (report first: ruff check --select B023,S110,BLE001,SIM105,T201 --statistics .)
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841", "F601", "F821"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"**/tests*/**" = ["F841"]
"**/tests*.py" = ["F841"]
"**/test_*.py" = ["F841"]
